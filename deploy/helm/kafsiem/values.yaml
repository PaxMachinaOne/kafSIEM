image:
  # Local-only / NAS-pinned (PLAN-06 E-03 / audit F-1). Iter-8 flips
  # to ghcr.io. Override via `--set image.repository=...` in any
  # other environment.
  repository: 192.168.0.131:5100/scalytics/kafsiem
  tag: "v1.7.0"
  pullPolicy: IfNotPresent

replicaCount: 1

# PSA-restricted-compatible defaults (PLAN-06 E-04 / audit F-4).
# The kafSIEM image runs Caddy 2.x. Caddy's binary has the file
# capability `cap_net_bind_service=ep` so it can bind privileged
# ports without running as root, but Kubernetes only honours that
# when both (a) the pod's capability set includes NET_BIND_SERVICE
# (granted below in containerSecurityContext) and (b) the process
# is allowed to run as the chosen UID. UID 1001 is the user the
# upstream caddy image bakes for the caddy binary (file `ls -l
# /usr/bin/caddy` shows owner 1001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    # kafSIEM serves the Caddy SPA on :80. The Caddy binary has file
    # capability `cap_net_bind_service=ep` baked in, so it can bind a
    # privileged port without running as root — provided the pod's
    # capability set includes NET_BIND_SERVICE. PSA-restricted allows
    # this single capability as a documented exception (CKV_K8S_28).
    add:
      - NET_BIND_SERVICE
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8500
  targetPort: 80

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

probes:
  liveness:
    httpGet: { path: /, port: 80 }
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet: { path: /, port: 80 }
    initialDelaySeconds: 2
    periodSeconds: 5

serviceAccount:
  create: true
  name: ""

labels:
  app.kubernetes.io/part-of: ops-foundation
